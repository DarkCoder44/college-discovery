services:
  postgres:
    image: postgres:16-alpine
    container_name: college_discovery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: college_discovery
    ports:
      - "5433:5432"
    volumes:
      - college_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  college_db_data:
